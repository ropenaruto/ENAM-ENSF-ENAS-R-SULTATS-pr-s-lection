<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résultats de la présélection — ENAM · EISJD · ENSF · ENAS</title>
<meta name="description" content="Listes officielles des candidats admis à la présélection — ENAM, EISJD, ENSF, ENAS — session de septembre 2026.">
<style>
  :root{
    --bg1:#0f2027;
    --bg2:#203a43;
    --bg3:#2c5364;
    --accent:#ffb703;
    --accent2:#fb8500;
    --card:#ffffff;
    --text:#1b2430;
    --muted:#6b7787;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    min-height:100vh;
    color:var(--text);
    padding-bottom:60px;
  }
  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px; }

  header{
    text-align:center;
    padding:36px 16px 20px;
  }
  .blink-wrap{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    animation: blink 1.1s infinite;
  }
  .blink-wrap svg{
    width:clamp(22px, 4.6vw, 34px);
    height:clamp(22px, 4.6vw, 34px);
    color:var(--accent);
    flex-shrink:0;
  }
  .blink{
    display:inline-block;
    font-size:clamp(20px, 4.6vw, 36px);
    font-weight:800;
    letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-transform:uppercase;
  }
  @keyframes blink{
    0%, 45%{ opacity:1; filter:drop-shadow(0 0 12px rgba(255,183,3,.7)); }
    50%, 95%{ opacity:0.25; filter:none; }
    100%{ opacity:1; }
  }
  .subtitle{
    color:#dce9f0;
    margin-top:10px;
    font-size:15px;
    opacity:.9;
  }
  .subtitle b{ color:#fff; }

  main{
    max-width:980px;
    margin:0 auto;
    padding:10px 16px;
  }

  .crumbs{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin:18px 0 22px;
    font-size:14px;
    color:#eaf2f6;
  }
  .crumbs button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    transition:.15s;
  }
  .crumbs button svg{ width:15px; height:15px; }
  .crumbs button:hover{ background:rgba(255,255,255,.25); }
  .crumbs span.sep{ opacity:.5; }
  .crumbs span.current{ font-weight:700; color:var(--accent); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:18px;
  }

  .card{
    background:var(--card);
    border-radius:16px;
    padding:26px 20px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    transition:transform .15s, box-shadow .15s;
    border:2px solid transparent;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 14px 30px rgba(0,0,0,.35);
    border-color:var(--accent);
  }
  .card .icon{
    width:44px; height:44px;
    margin:0 auto 12px;
    color:var(--accent2);
  }
  .card .icon svg{ width:100%; height:100%; }
  .card h3{ margin:0 0 6px; font-size:18px; }
  .card p{ margin:0; color:var(--muted); font-size:13px; }
  .card.disabled{
    opacity:.45;
    cursor:not-allowed;
  }
  .card.disabled:hover{ transform:none; box-shadow:0 8px 24px rgba(0,0,0,.25); border-color:transparent;}
  .card.disabled .icon{ color:var(--muted); }

  .doc-row{
    background:var(--card);
    border-radius:14px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
    flex-wrap:wrap;
  }
  .doc-row .info{ display:flex; align-items:center; gap:14px; }
  .doc-row .info .picto{
    width:46px;height:46px;border-radius:12px;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    display:flex;align-items:center;justify-content:center;
    color:#fff; flex-shrink:0;
  }
  .doc-row .info .picto svg{ width:22px; height:22px; }
  .doc-row h4{ margin:0 0 3px; font-size:16px; }
  .doc-row small{ color:var(--muted); }
  .doc-row .actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border-radius:24px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    transition:.15s;
  }
  .btn svg{ width:15px; height:15px; }
  .btn-primary{
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    color:#fff;
  }
  .btn-primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .btn-outline{
    background:transparent;
    color:#2c5364;
    border:1.5px solid #2c5364;
  }
  .btn-outline:hover{ background:#2c5364; color:#fff; }

  .empty{
    color:#eaf2f6;
    text-align:center;
    padding:40px 20px;
    opacity:.8;
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:12px;
    margin-top:50px;
  }
</style>
</head>
<body>

<header>
  <div class="blink-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v3.5c0 1-.4 2-1.1 2.7L4.5 15h15l-1.4-1.8c-.7-.7-1.1-1.7-1.1-2.7V7a5 5 0 0 0-5-5z"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0"/></svg>
    <span class="blink">Résultats de la présélection</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v3.5c0 1-.4 2-1.1 2.7L4.5 15h15l-1.4-1.8c-.7-.7-1.1-1.7-1.1-2.7V7a5 5 0 0 0-5-5z"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0"/></svg>
  </div>
  <div class="subtitle">Concours d'entrée <b>ENAM · EISJD · ENSF · ENAS</b> — Session de Septembre 2026</div>
</header>

<main>
  <div class="crumbs" id="crumbs"></div>
  <div id="content"></div>
</main>

<footer>Vérifiez votre nom sur la liste correspondant à votre filière et à votre centre de composition.</footer>

<script>
/* ---------------- icônes SVG (traits fins, aucune emoji) ---------------- */
const ICONS = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg>`,
  stethoscope: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M6 3H4.5M14 3h1.5"/><path d="M18 10v2a6 6 0 0 1-12 0v-1"/><circle cx="19" cy="9" r="2"/></svg>`,
  heartHands: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7-4.35-9.3-8.86C1.4 8.9 2.86 6 5.7 6c1.63 0 2.9.95 3.55 2.06M12 20.5s7-4.35 9.3-8.86C22.6 8.9 21.14 6 18.3 6c-1.63 0-2.9.95-3.55 2.06"/><path d="M9.3 8.06C9.9 6.98 11 6 12.35 6c1 0 1.85.5 2.4 1.25"/></svg>`,
  babyCarriage: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 0 1 14 0v5H5z"/><path d="M19 12h1.5M9 3.5C7.5 5 6.2 7 5.6 9"/><circle cx="8" cy="20" r="1.4"/><circle cx="16" cy="20" r="1.4"/></svg>`,
  building: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15"/><path d="M4 21h16M9 9h1M14 9h1M9 13h1M14 13h1M9 21v-4h6v4"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.86-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.14-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>`,
  doc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12.5h5M9.5 15.5h5M9.5 9.5h2"/></svg>`,
  pill: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9.5" width="17" height="6.5" rx="3.25" transform="rotate(-35 12 12.75)"/><path d="M9.5 8.7l5 5.3"/></svg>`,
  droplet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 10.8A6 6 0 0 1 6 13.8C6 9.6 12 3 12 3z"/></svg>`,
  activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg>`,
  eyeScan: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></svg>`,
  bone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 17.5l11-11"/><circle cx="5" cy="19" r="2.1"/><circle cx="6.4" cy="17.6" r="2.1"/><circle cx="17.6" cy="6.4" r="2.1"/><circle cx="19" cy="5" r="2.1"/></svg>`,
  eye: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.4"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 18h15"/></svg>`,
};

function pickDocIcon(title){
  const t = title.toLowerCase();
  if(t.includes("pharmacie")) return ICONS.pill;
  if(t.includes("hygiène") || t.includes("hygiene")) return ICONS.droplet;
  if(t.includes("kiné") || t.includes("kine") || t.includes("anesthésie") || t.includes("tar")) return ICONS.activity;
  if(t.includes("ophtalmo") || t.includes("radio")) return ICONS.eyeScan;
  if(t.includes("orthoprothés") || t.includes("orthopéd")) return ICONS.bone;
  if(t.includes("sage-femme")) return ICONS.babyCarriage;
  return ICONS.doc;
}

/* ---------------- données (structure officielle vérifiée) ---------------- */
const DATA = {
  ENAM: {
    label: "ENAM",
    full: "École Nationale des Auxiliaires Médicaux",
    icon: ICONS.stethoscope,
    localities: {
      "Lomé": [
        {title:"Auxiliaires d'État en Pharmacie", file:"AEP_Pharmacie_Lome.pdf"},
        {title:"Assistants d'Hygiène d'État", file:"AHE_Hygiene_Lome.pdf"},
        {title:"Kinésithérapeutes d'État / TAR", file:"KINE_TAR_Lome.pdf"},
        {title:"Techniciens en Ophtalmologie / Radiologie", file:"Ophtalmo_Radio_Lome.pdf"},
        {title:"Techniciens Orthoprothésistes", file:"Orthoprothesiste_Lome.pdf"},
      ],
      "Kpalimé / Atakpamé": [
        {title:"Infirmiers Diplômés d'État", file:"IDE_Kpalime_Atakpame.pdf"},
      ],
      "Kara": [
        {title:"Infirmiers Diplômés d'État", file:"IDE_Kara.pdf"},
        {title:"Techniciens d'Anesthésie-Réanimation (TAR)", file:"TAR_Kara.pdf"},
      ],
      "Dapaong": [
        {title:"Infirmiers Diplômés d'État", file:"IDE_Dapaong.pdf"},
      ],
    }
  },
  EISJD: {
    label: "EISJD",
    full: "École des Infirmiers Saint Jean de Dieu",
    icon: ICONS.heartHands,
    localities: {
      "Afagnan": [
        {title:"Infirmiers Diplômés d'État", file:"IDE_Afagnan.pdf"},
      ],
    }
  },
  ENSF: {
    label: "ENSF",
    full: "École Nationale des Sages-Femmes",
    icon: ICONS.babyCarriage,
    localities: {
      "Lomé": [{title:"Liste des candidates sages-femmes", file:"ENSF_Lome.pdf"}],
      "Kpalimé": [{title:"Liste des candidates sages-femmes", file:"ENSF_Kpalime.pdf"}],
      "Tsévié": [{title:"Liste des candidates sages-femmes", file:"ENSF_Tsevie.pdf"}],
      "Dapaong": [{title:"Liste des candidates sages-femmes", file:"ENSF_Dapaong.pdf"}],
    }
  },
  ENAS: {
    label: "ENAS",
    full: "École Nationale des Aides Sanitaires — Sokodé",
    icon: ICONS.building,
    localities: {}
  }
};

let state = { level: "home", etab: null, loc: null };

/* ---------------- navigation / bouton retour du téléphone ---------------- */
function goTo(newState){
  state = newState;
  history.pushState(state, "");
  render();
}
window.addEventListener("popstate", (e)=>{
  state = e.state || { level:"home", etab:null, loc:null };
  render();
});
history.replaceState(state, "");

function render(){
  const crumbs = document.getElementById("crumbs");
  const content = document.getElementById("content");
  crumbs.innerHTML = "";
  content.innerHTML = "";

  const homeBtn = document.createElement("button");
  homeBtn.innerHTML = ICONS.home + `<span>Établissements</span>`;
  homeBtn.onclick = ()=>{ goTo({level:"home", etab:null, loc:null}); };
  crumbs.appendChild(homeBtn);

  if(state.etab){
    crumbs.insertAdjacentHTML("beforeend", `<span class="sep">›</span>`);
    const b = document.createElement("button");
    b.innerHTML = `<span>${state.etab}</span>`;
    b.onclick = ()=>{ goTo({level:"etab", etab:state.etab, loc:null}); };
    crumbs.appendChild(b);
  }
  if(state.loc){
    crumbs.insertAdjacentHTML("beforeend", `<span class="sep">›</span><span class="current">${state.loc}</span>`);
  }

  if(state.level === "home"){
    const grid = document.createElement("div");
    grid.className = "grid";
    Object.keys(DATA).forEach(key=>{
      const e = DATA[key];
      const hasDocs = Object.keys(e.localities).length > 0;
      const card = document.createElement("div");
      card.className = "card" + (hasDocs ? "" : " disabled");
      card.tabIndex = hasDocs ? 0 : -1;
      card.innerHTML = `<div class="icon">${e.icon}</div><h3>${e.label}</h3><p>${e.full}</p>`;
      if(hasDocs){
        card.onclick = ()=>{ goTo({level:"etab", etab:key, loc:null}); };
        card.onkeydown = (ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); card.onclick(); } };
      } else {
        card.innerHTML += `<p style="margin-top:8px;color:#c0392b;font-weight:600;">Aucun document disponible</p>`;
      }
      grid.appendChild(card);
    });
    content.appendChild(grid);
  }

  else if(state.level === "etab"){
    const e = DATA[state.etab];
    const locs = Object.keys(e.localities);
    if(locs.length === 0){
      content.innerHTML = `<div class="empty">Aucune liste n'a encore été publiée pour cet établissement.</div>`;
      return;
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    locs.forEach(loc=>{
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      const n = e.localities[loc].length;
      card.innerHTML = `<div class="icon">${ICONS.pin}</div><h3>${loc}</h3><p>${n} document${n>1?'s':''}</p>`;
      card.onclick = ()=>{ goTo({level:"loc", etab:state.etab, loc:loc}); };
      card.onkeydown = (ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); card.onclick(); } };
      grid.appendChild(card);
    });
    content.appendChild(grid);
  }

  else if(state.level === "loc"){
    const docs = DATA[state.etab].localities[state.loc];
    docs.forEach(doc=>{
      const row = document.createElement("div");
      row.className = "doc-row";
      row.innerHTML = `
        <div class="info">
          <div class="picto">${pickDocIcon(doc.title)}</div>
          <div>
            <h4>${doc.title}</h4>
            <small>${state.loc} — PDF</small>
          </div>
        </div>
        <div class="actions">
          <a class="btn btn-outline" href="${doc.file}" target="_blank" rel="noopener">${ICONS.eye} Ouvrir</a>
          <a class="btn btn-primary" href="${doc.file}" download>${ICONS.download} Télécharger</a>
        </div>
      `;
      content.appendChild(row);
    });
  }
}

render();
</script>

</body>
</html>
